name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $root = $PWD.Path
          $fail = $false
          Get-ChildItem -Path $root -Include *.ps1,*.psm1 -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\tools\\' -or $true } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                Write-Host "PARSE FAIL: $($_.FullName)"
                $errors | Format-List
                $fail = $true
              } else {
                Write-Host "OK: $($_.Name)"
              }
            }
          if ($fail) { exit 1 }
          Write-Host 'ALL_PARSE_OK'